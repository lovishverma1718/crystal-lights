# ==============================================================================
# Netlify Configuration for Crystal Lights
# https://docs.netlify.com/configure-builds/file-based-configuration/
# ==============================================================================

[build]
  publish = "."

# ------------------------------------------------------------------------------
# Caching headers for minimum bandwidth consumption
# ------------------------------------------------------------------------------

# Static media and fonts cached for long-term delivery
[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# CSS & JavaScript revalidate immediately so updates reflect instantly
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# HTML files revalidate on every visit
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Clear-Site-Data = '"cache"'

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
